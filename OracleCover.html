<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甲骨文学习 · 封面</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #2b2621;
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC",
                 "Source Han Serif SC", serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    background: #f9f5ec;
    padding: 12mm;
    overflow: hidden;
    page-break-after: always;
  }

  /* 背景裂纹底纹 */
  .bg {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    pointer-events: none;
  }

  /* 双线边框 */
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    border: 0.8mm solid #2b2621;
    padding: 2mm;
    display: flex;
  }

  .frame-inner {
    flex: 1;
    border: 0.25mm solid #2b2621;
    padding: 14mm 16mm 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* ── 顶部 ── */
  .head {
    text-align: center;
    width: 100%;
  }

  .kicker {
    font-size: 11pt;
    letter-spacing: 0.9em;
    text-indent: 0.9em;
    color: #2b2621;
  }

  .kicker-en {
    margin-top: 2.5mm;
    font-size: 6.5pt;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: #8a8175;
    font-family: Georgia, "Times New Roman", serif;
  }

  .rule {
    margin: 5mm auto 0;
    width: 26mm;
    height: 0.5mm;
    background: #2b2621;
  }

  /* ── 主标题 ── */
  .title-block {
    text-align: center;
    width: 100%;
    margin-top: 2mm;
  }

  h1 {
    margin: 0;
    font-size: 46pt;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    line-height: 1.25;
  }

  .subtitle {
    margin-top: 6mm;
    font-size: 12pt;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: #5c5449;
  }

  /* ── 中央字形 ── */
  .glyph-block {
    text-align: center;
  }

  .glyph-frame {
    width: 62mm;
    height: 78mm;
    border: 0.3mm solid #b9afa0;
    border-radius: 1mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffdf8;
  }

  .glyph-frame svg {
    width: 60%;
    height: 78%;
  }

  .glyph-note {
    margin-top: 4mm;
    font-size: 8.5pt;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: #8a8175;
  }

  /* ── 填写区 ── */
  .fields {
    width: 100%;
    max-width: 112mm;
    display: flex;
    flex-direction: column;
    gap: 6.5mm;
  }

  .field {
    display: flex;
    align-items: flex-end;
    font-size: 11pt;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
  }

  .field span {
    flex: none;
    color: #3b352d;
  }

  .field i {
    flex: 1;
    height: 6mm;
    margin-left: 4mm;
    border-bottom: 0.3mm solid #b9afa0;
  }

  /* ── 底部引言 ── */
  .foot {
    text-align: center;
    width: 100%;
  }

  .quote {
    font-size: 10.5pt;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: #3b352d;
  }

  .quote-src {
    margin-top: 2.5mm;
    font-size: 7.5pt;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    color: #8a8175;
  }

  /* ── 朱印 ── */
  .seal {
    position: absolute;
    right: 8mm;
    bottom: 8mm;
    width: 15mm;
    height: 15mm;
    border: 0.9mm solid #a63d2f;
    border-radius: 0.8mm;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a63d2f;
    font-size: 9.5pt;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.15;
    text-align: center;
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="page">

  <!-- 背景裂纹底纹 -->
  <svg class="bg" viewBox="0 0 210 297" preserveAspectRatio="none">
    <g stroke="#2b2621" stroke-width="0.4" fill="none">
      <path d="M28 44 L52 62 L44 88 L70 104"/>
      <path d="M52 62 L82 54 L96 76"/>
      <path d="M158 36 L176 58 L164 82 L188 96"/>
      <path d="M176 58 L196 50"/>
      <path d="M24 208 L48 222 L38 248 L62 262"/>
      <path d="M150 214 L170 232 L160 258"/>
      <path d="M170 232 L192 226"/>
      <path d="M96 12 L112 26"/>
      <path d="M104 282 L124 268 L140 284"/>
    </g>
  </svg>

  <div class="frame">
    <div class="frame-inner">

      <!-- 顶部 -->
      <div class="head">
        <div class="kicker">契文析字</div>
        <div class="kicker-en">ORACLE BONE INSCRIPTIONS</div>
        <div class="rule"></div>
      </div>

      <!-- 主标题 -->
      <div class="title-block">
        <h1>甲骨文</h1>
        <div class="subtitle">临习 · 释读 · 篆刻转化</div>
      </div>

      <!-- 中央字形 -->
      <div class="glyph-block">
        <div class="glyph-frame">
          <svg viewBox="0 0 120 160" aria-label="甲骨文 卜">
            <line x1="60" y1="16" x2="60" y2="144"
                  stroke="#2b2621" stroke-width="5" stroke-linecap="round"/>
            <line x1="60" y1="78" x2="96" y2="64"
                  stroke="#2b2621" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="glyph-note">卜 · 象兆坼之形</div>
      </div>

      <!-- 填写区 -->
      <div class="fields">
        <div class="field"><span>姓名</span><i></i></div>
        <div class="field"><span>起始</span><i></i></div>
        <div class="field"><span>册次</span><i></i></div>
      </div>

      <!-- 底部引言 -->
      <div class="foot">
        <div class="quote">惟殷先人，有册有典</div>
        <div class="quote-src">《尚书 · 多士》</div>
      </div>

    </div>
  </div>

  <!-- 朱印 -->
  <div class="seal">日<br>课</div>

</div>

</body>
</html>
