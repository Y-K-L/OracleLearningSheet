<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甲骨卜辞整句卡 · 章法笔记</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 210mm;
    height: 297mm;
    padding: 10mm;
    background: #fff;
    page-break-after: always;
  }

  .sheet:last-of-type { page-break-after: auto; }

  .card {
    width: 100%;
    height: 100%;
    padding: 7mm;
    border: 0.5mm solid #b9afa0;
    border-radius: 4mm;
    background: #fffdf8;
    display: flex;
    flex-direction: column;
    gap: 3mm;
    overflow: hidden;
  }

  /* ── 顶部：合集编号 / 分期 ── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3mm;
    font-size: 10pt;
    color: #555;
    border-bottom: 0.35mm dashed #ddd5c8;
    padding-bottom: 2.5mm;
  }

  .collection {
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  .fill {
    display: inline-block;
    height: 4.5mm;
    border-bottom: 0.3mm solid #c5bdb0;
    vertical-align: bottom;
    margin-left: 1mm;
  }

  .fill-num { width: 40mm; }
  .fill-phase { width: 34mm; }

  /* ── 通用字段 ── */
  .section {
    display: flex;
    flex-direction: column;
    gap: 1.5mm;
  }

  .label {
    font-size: 8pt;
    color: #8a8175;
    letter-spacing: 0.5pt;
  }

  .wline {
    height: 7.5mm;
    border-bottom: 0.3mm solid #ddd5c8;
  }

  /* ── 摹写 / 对临大框 ── */
  .box {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 0.35mm solid #cfc7b9;
    border-radius: 3mm;
    overflow: hidden;
  }

  .box-label {
    flex: none;
    font-size: 8pt;
    color: #8a8175;
    letter-spacing: 0.5pt;
    padding: 1.5mm 2.5mm;
    border-bottom: 0.25mm dashed #ddd5c8;
    background: #fbf8f1;
  }

  .box-body {
    flex: 1;
    min-height: 0;
    background-image:
      repeating-linear-gradient(0deg, #f2ede3 0 0.15mm, transparent 0.15mm 8mm),
      repeating-linear-gradient(90deg, #f2ede3 0 0.15mm, transparent 0.15mm 8mm);
  }

  /* ── 章法笔记 ── */
  .notes {
    display: flex;
    flex-direction: column;
    gap: 1.5mm;
    border-top: 0.35mm solid #e3dbcf;
    padding-top: 2.5mm;
  }

  .notes-title {
    font-size: 9pt;
    color: #555;
    font-weight: 600;
    letter-spacing: 0.5pt;
    margin-bottom: 0.5mm;
  }

  .note-item {
    display: flex;
    flex-direction: column;
    gap: 1mm;
  }

  .note-item .wline { height: 6.5mm; }

  .last-note .wline { height: 7.5mm; }
</style>
</head>
<body>

<!-- 一页一张卡。复制整个 <section> 可增加页数。 -->
<section class="sheet">
  <div class="card">

    <!-- 合集编号 / 分期 -->
    <div class="top">
      <div class="collection">
        合集编号：《合集》<span class="fill fill-num"></span>
      </div>
      <div class="collection">
        分期：<span class="fill fill-phase"></span>
      </div>
    </div>

    <!-- 释文 -->
    <div class="section">
      <div class="label">释文</div>
      <div class="wline"></div>
      <div class="wline"></div>
      <div class="wline"></div>
    </div>

    <!-- 原拓双钩区 -->
    <div class="box">
      <div class="box-label">原拓双钩区</div>
      <div class="box-body"></div>
    </div>

    <!-- 整句对临区 -->
    <div class="box">
      <div class="box-label">整句对临区</div>
      <div class="box-body"></div>
    </div>

    <!-- 章法笔记（篆刻转化） -->
    <div class="notes">
      <div class="notes-title">章法笔记（篆刻转化）</div>

      <div class="note-item">
        <div class="label">字大小变化</div>
        <div class="wline"></div>
      </div>

      <div class="note-item">
        <div class="label">穿插避让</div>
        <div class="wline"></div>
      </div>

      <div class="note-item">
        <div class="label">线条质感</div>
        <div class="wline"></div>
      </div>

      <div class="note-item last-note">
        <div class="label">印章创作设想</div>
        <div class="wline"></div>
        <div class="wline"></div>
      </div>
    </div>

  </div>
</section>

</body>
</html>
