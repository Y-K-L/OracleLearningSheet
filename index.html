<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甲骨文学习卡片</title>
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #fff;
    color: #3b3b3b;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }

  .sheet {
    width: 210mm;
    height: 297mm;
    padding: 10mm;
    background: #fff;
    page-break-after: always;
  }

  .sheet:last-of-type {
    page-break-after: auto;
  }

  .card {
    width: 100%;
    height: 100%;
    border: 0.5mm solid #c9c2b6;
    border-radius: 5mm;
    background: #fffdf8;
    padding: 7mm;
    display: flex;
    flex-direction: column;
    gap: 4mm;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 0.35mm dashed #d8d0c2;
    padding-bottom: 3mm;
    min-height: 24mm;
  }

  .today {
    font-size: 42pt;
    font-weight: 600;
    line-height: 1;
    color: #333;
  }

  .reading {
    font-size: 10pt;
    color: #8a8175;
    margin-top: 3mm;
  }

  .meta {
    font-size: 9pt;
    color: #8a8175;
    line-height: 2;
    text-align: right;
    white-space: nowrap;
  }

  .glyph-box {
    height: 82mm;
    border: 0.45mm dashed #b9afa0;
    border-radius: 4mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #b0a696;
    font-size: 10pt;
    text-align: center;
    line-height: 1.8;
    padding: 4mm;
  }

  .field {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .label {
    font-size: 8pt;
    color: #9a9082;
    letter-spacing: 0.4pt;
    margin-bottom: 1.5mm;
  }

  .line {
    height: 7mm;
    border-bottom: 0.3mm solid #ddd5c8;
  }

  .example .line {
    height: 7.5mm;
  }

  .bottom {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 8pt;
    color: #9a9082;
    border-top: 0.35mm solid #e3dbcf;
    padding-top: 3mm;
    gap: 3mm;
  }

  .check-group {
    display: flex;
    align-items: center;
    gap: 2mm;
    white-space: nowrap;
  }

  .circle {
    width: 4mm;
    height: 4mm;
    border: 0.35mm solid #b9afa0;
    border-radius: 50%;
    display: inline-block;
  }

  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<!-- 一页一张卡。复制整个 section 可增加页数。 -->
<section class="sheet">
  <div class="card">

    <div class="card-header">
      <div>
        <div class="today">今字</div>
        <div class="reading">拼音 / 读音：________________</div>
      </div>
      <div class="meta">
        部首：____________<br>
        六书：____________<br>
        字形出处：________
      </div>
    </div>

    <div class="glyph-box">
      甲骨字形<br>
      （手写 / 贴图）
    </div>

    <div class="field">
      <div class="label">构形 / 来源</div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>

    <div class="field">
      <div class="label">本义 / 释义</div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>

    <div class="field example">
      <div class="label">卜辞例句</div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>

    <div class="field">
      <div class="label">出处 / 编号</div>
      <div class="line"></div>
    </div>

    <div class="bottom">
      <div class="check-group">
        复习：
        <span class="circle"></span>
        <span class="circle"></span>
        <span class="circle"></span>
      </div>
      <div class="check-group">
        掌握：
        <span class="circle"></span>
        <span class="circle"></span>
        <span class="circle"></span>
      </div>
    </div>

  </div>
</section>

<!--
复制下面整段可增加一页：
<section class="sheet">
  <div class="card">
    ...同上...
  </div>
</section>
-->

</body>
</html>
